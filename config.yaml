project:
  name: "AI-Based Product Demand Forecasting System"
  version: "1.0.0"
  author: "Srujan Kinjawadekar"

data:
  raw_data_path: "data/raw"
  processed_data_path: "data/processed"
  sample_data_path: "data/sample_data.csv"
  target_column: "Quantity"
  date_column: "InvoiceDate"
  test_size: 0.2
  random_state: 42

features:
  categorical_columns: ["Country", "StockCode", "Description"]
  numerical_columns: ["UnitPrice", "CustomerID"]
  lag_periods: [1, 7, 14, 30]
  rolling_windows: [7, 14, 30]

models:
  traditional:
    random_forest:
      n_estimators: 100
      max_depth: 10
      random_state: 42
    xgboost:
      n_estimators: 100
      learning_rate: 0.1
      max_depth: 6
      random_state: 42
    lightgbm:
      n_estimators: 100
      learning_rate: 0.1
      num_leaves: 31
      random_state: 42
    catboost:
      iterations: 100
      learning_rate: 0.1
      depth: 6
      verbose: 0
    linear_regression: {}
  lstm:
    sequence_length: 30
    units: 64
    dropout: 0.2
    epochs: 50
    batch_size: 32
  ensemble:
    method: "weighted_average"

paths:
  artifacts_dir: "artifacts"
  models_dir: "models"
  logs_dir: "logs"
  notebooks_dir: "notebooks"
